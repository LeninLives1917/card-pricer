# Card-Pricer V2 — Render service definition
# Owner: A8 | Slice: S4
#
# Per docs/V2_ARCHITECTURE.md §1 + Q2 (Render Starter $7/mo + persistent disk).
# Per V2_AUDIT.md §4 — V1 render.yaml only declared 6 of 19+ env vars; this
# file lists every var the code references plus V2-new flags (Q3, Q5).
#
# IMPORTANT: This file lives at infra/render.yaml. The V1 render.yaml at the
# repo root is the LIVE production deploy spec — DO NOT MODIFY IT until
# phase-5 cutover (per Q6 in-place deploy runbook). At cutover the orchestrator
# replaces /render.yaml with this file's contents in a single commit.
#
# Region rationale: Supabase project is eu-west-1 (Ireland). Render's nearest
# region is `frankfurt`; that keeps round-trip from Express to Postgres in
# the same continent. London (`oregon` is US, `singapore` is APAC, `ohio`
# is US, etc.) — frankfurt wins on latency to a Dublin-region Supabase.

services:
  - type: web
    name: card-pricer
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install && node --check apps/server/server.js
    startCommand: node apps/server/server.js
    healthCheckPath: /api/health

    # Persistent disk (Q2). data/card-db.json + data/card-prices.json +
    # data/card-phashes.json + logs/ all survive redeploys.
    #
    # Mount path is the repo's data/ directory. The original V2 config used
    # /opt/render/project/data which did NOT match where the code writes
    # (REPO_ROOT in _card-db-boot.js, phash.js, and the crawler all resolve
    # to /opt/render/project/src/data). The disk was effectively unused —
    # every redeploy wiped data/ contents and lost crawler progress. Fixed
    # 2026-05-09 by pointing mountPath at the actual repo data/ path.
    disk:
      name: card-pricer-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

    envVars:
      # ---------------- Anthropic (REQUIRED) ----------------
      - key: ANTHROPIC_API_KEY
        sync: false

      # ---------------- Supabase (REQUIRED) ----------------
      # Without these, every /api/* that requires auth returns 503.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # ---------------- Stripe (OPTIONAL but production needs them) ----------------
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_SOLO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_SOLO_YEARLY
        sync: false
      - key: STRIPE_PRICE_VENDOR_MONTHLY
        sync: false
      - key: STRIPE_PRICE_VENDOR_YEARLY
        sync: false
      - key: STRIPE_PRICE_SHOP_MONTHLY
        sync: false
      - key: STRIPE_PRICE_SHOP_YEARLY
        sync: false

      # ---------------- Brevo (OPTIONAL — emails + newsletter) ----------------
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_NEWSLETTER_LIST_ID
        sync: false

      # ---------------- eBay sold-comps (OPTIONAL) ----------------
      - key: EBAY_APP_ID
        sync: false
      - key: EBAY_CERT_ID
        sync: false

      # ---------------- Third-party pricing APIs (OPTIONAL) ----------------
      - key: JUSTTCG_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: POKEMON_TCG_API_KEY
        sync: false

      # ---------------- Card DB source-of-truth (OPTIONAL) ----------------
      - key: CARD_DB_SHEET_URL
        sync: false

      # ---------------- Single-tenant fallbacks (OPTIONAL) ----------------
      - key: SHOP_NAME
        sync: false
      - key: SHOP_EMAIL
        sync: false

      # ---------------- Privacy / quote-leads ip hash (OPTIONAL) ----------------
      - key: IP_HASH_SALT
        sync: false

      # ---------------- V2-NEW feature flags (Q3) ----------------
      # OCR-first scan path; OFF by default, flip to true once telemetry
      # confirms FP rate < OCR_FIRST_FP_THRESHOLD.
      - key: OCR_FIRST_ENABLED
        value: "false"
      # Sessions cutover (F17). Reads prefer relational store when true.
      # Stays false through the dual-write window; flipped near end of phase 4.
      - key: READ_FROM_RELATIONAL
        value: "false"

      # ---------------- V2-NEW observability (Q5) ----------------
      - key: SENTRY_DSN_SERVER
        sync: false
      - key: SENTRY_DSN_BROWSER
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      # Wired by the build pipeline; if blank the /api/version endpoint
      # falls back to "unknown".
      - key: GIT_SHA
        sync: false
      # Optional Prometheus scraper bearer token. When set + matching
      # Authorization: Bearer <token>, /api/metrics scrapes without
      # round-tripping Supabase auth. Unset → admin-JWT-only access.
      - key: METRICS_TOKEN
        sync: false
      # Build timestamp for /api/version. Wired by the Render build step
      # (e.g. `date -u +%Y-%m-%dT%H:%M:%SZ > .built_at`). null on prod
      # if the build step doesn't set it — /api/version returns null.
      - key: BUILT_AT
        sync: false
      - key: LOG_LEVEL
        value: info

      # ---------------- V2-NEW sealed pricing (S17 + V2.0.1) ----------------
      # Sealed product pricing uses pricing/adapters/cardmarket-sealed.js,
      # which best-effort scrapes Cardmarket product pages. Cloudflare
      # blocks ~most of the time; when it does, /api/v2/price-sealed
      # returns the URL only with blocked_by:'cloudflare' and the operator
      # supplies manual_market_eur from the live Cardmarket page.
      # NO API KEY REQUIRED. The adapter is always available.
      # (V2.0.1 dropped the previous TCGPLAYER_PRO_* env vars when the
      # adapter was swapped from TCGPlayer Pro to Cardmarket sealed.)

      # ---------------- Runtime (NON-SECRET) ----------------
      # Perspective rectification for card photos. MUST be declared here, not
      # only in the dashboard: Render reconciles the environment against this
      # blueprint on every deploy, so a dashboard-only variable is silently
      # dropped on the next one. That is exactly what happened — the value was
      # saved correctly and vanished, while ANTHROPIC_API_KEY (declared here
      # with sync:false) kept working.
      #
      # Off falls back to cropToCard's .trim() heuristic, which measured 1.0%
      # top-1 on realistic scenes against 40.5% rectified.
      - key: CARD_RECTIFY
        value: "1"
      # How much authority the local pHash fast path has: off | shadow | primary.
      #
      # Set explicitly to shadow on 2026-08-07. It had been answering
      # authoritatively and was measured wrong 4 times out of 4 across the
      # first 11 production scans — every failure an unrelated card, the
      # signature of a fingerprint collision. The 7 cards that reached the
      # vision model were all correct.
      #
      # Then measured properly against 64 labelled photographs
      # (docs/V3_BENCHMARK.md §15, scripts/v3-bench/phash-sweep.js): the
      # correct card sits at median Hamming distance 26 while some unrelated
      # card is always within 4-12. In 51 of 51 photos the right answer is
      # FARTHER away than a wrong one, and 0 of 51 fall within the threshold
      # of 8. There is no threshold to find — every match it ever served was
      # a collision. Set to off; the replacement is the DINOv2 embedding
      # index, which scores ~96% on catalogue-present cards.
      - key: PHASH_FAST_PATH
        value: "off"

      - key: NODE_VERSION
        value: 20.10.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DEFAULT_BUY_PERCENTAGE
        value: "60"
