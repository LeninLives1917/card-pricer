<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f7f4ef" />
  <title>Show desk</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Soft palette (Liam, 9 Oct 2026: "more user friendly and softer colours").
       --accent is the shop's own colour, calmed in script. */
    :root {
      --accent: #8a5a2b; --accent-ink: #6f4620; --accent-tint: #f6efe6; --accent-line: #e7d8c6;
      --bg: #f7f4ef; --card: #ffffff; --soft: #fbf9f6; --ink: #2f2a26; --ink-2: #5b544d; --ink-3: #8a837b;
      --line: #e8e2d9; --line-2: #d9d1c5;
      --ok-bg: #e7f3ea; --ok: #2f7a45; --warn-bg: #fbf0dc; --warn: #9a6a12; --bad-bg: #fbecea; --bad: #b4473f;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
    button, select, input, textarea { font: inherit; }
    .bar { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px 14px; padding: 10px 16px; flex-wrap: wrap; }
    .bar h1 { margin: 0; font-size: 18px; font-weight: 800; }
    .bar .sub { color: var(--ink-3); font-size: 14px; }
    .bar .sub b { color: var(--accent-ink); }
    .tabs { display: flex; gap: 4px; margin-left: auto; background: var(--bg); padding: 4px; border-radius: 12px; }
    .tabs button { background: transparent; color: var(--ink-2); border: 0; padding: 7px 14px; cursor: pointer; border-radius: 9px; font-weight: 600; }
    .tabs button.on { background: var(--card); color: var(--ink); font-weight: 800; box-shadow: 0 1px 3px rgba(47,42,38,0.12); }
    .bar .link { color: var(--ink-3); background: none; border: 0; cursor: pointer; text-decoration: underline; font-size: 14px; }
    .wrap { display: grid; grid-template-columns: 340px 1fr; gap: 0; height: calc(100% - 58px); }
    .list { overflow-y: auto; border-right: 1px solid var(--line); padding: 10px; }
    .empty { padding: 30px 20px; color: var(--ink-3); text-align: center; }
    .newbtn { display: block; width: 100%; margin-bottom: 10px; padding: 13px; border: 1.5px dashed var(--accent-line); background: var(--accent-tint); color: var(--accent-ink); border-radius: var(--radius); font-weight: 800; cursor: pointer; font-size: 15px; }
    .newbtn:hover { border-color: var(--accent); }
    .tk { display: grid; grid-template-columns: 64px 1fr; gap: 0 12px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; padding: 12px 14px; cursor: pointer; color: inherit; }
    .tk:hover { border-color: var(--accent-line); }
    .tk.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
    .tk.fresh { animation: fresh 2.4s ease-out; }
    @keyframes fresh { 0% { background: var(--accent-tint); } 100% { background: var(--card); } }
    .tk .n { grid-row: span 3; font-size: 30px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; padding-top: 2px; color: var(--accent-ink); }
    .tk .who { font-weight: 800; font-size: 16px; }
    .tk .meta { font-size: 13px; color: var(--ink-3); }
    .tk .money { font-size: 14px; margin-top: 2px; }
    .tk .money b { color: var(--accent-ink); }
    .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
    .badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--ink-2); }
    .badge.warn { background: var(--warn-bg); color: var(--warn); }
    .badge.bad { background: var(--bad-bg); color: var(--bad); }
    .detail { overflow-y: auto; padding: 20px 22px 60px; }
    .dh { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    .dh .n { font-size: 48px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; color: var(--accent-ink); }
    .dh .who { font-size: 23px; font-weight: 800; }
    .dh .meta { color: var(--ink-3); font-size: 14px; }
    .back { display: none; background: none; border: 0; color: var(--accent-ink); font-weight: 700; padding: 0; margin-bottom: 10px; cursor: pointer; }
    .totals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
    .totals > div { padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
    .totals > div.credit { background: var(--accent-tint); border-color: var(--accent-line); }
    .totals .k { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
    .totals .v { font-size: 27px; font-weight: 900; letter-spacing: -0.02em; }
    .totals .credit .v { color: var(--accent-ink); }
    .note { margin-top: 10px; font-size: 14px; color: var(--ink-2); line-height: 1.5; }
    .alert { margin-top: 12px; padding: 10px 12px; background: var(--bad-bg); color: var(--bad); font-size: 14px; border-radius: 10px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .btn { border: 1.5px solid var(--line-2); background: var(--card); color: var(--ink); padding: 10px 16px; cursor: pointer; font-weight: 700; border-radius: 12px; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.good { background: var(--ok); border-color: var(--ok); color: #fff; }
    .btn[disabled] { opacity: 0.55; cursor: progress; }
    .tablewrap { overflow-x: auto; margin-top: 18px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); padding: 10px; border-bottom: 1px solid var(--line); background: var(--soft); }
    td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 15px; }
    tbody tr:last-child td { border-bottom: 0; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    td.credit { font-weight: 800; color: var(--accent-ink); }
    .card { display: flex; gap: 10px; align-items: flex-start; }
    .card img { width: 42px; aspect-ratio: 63/88; object-fit: contain; background: var(--bg); border-radius: 4px; flex: none; }
    .card .nm { font-weight: 700; }
    .card .st { font-size: 13px; color: var(--ink-3); }
    .card .ln { font-size: 12px; color: var(--ink-3); }
    .card .nt { font-size: 12px; color: var(--warn); }
    select { border: 1.5px solid var(--line-2); padding: 5px 6px; background: #fff; border-radius: 8px; }
    tr.ask td, tr.nf td, tr.bh td { background: var(--soft); }
    .q { font-size: 14px; color: var(--ink-2); margin: 2px 0 8px; }
    .opts { display: flex; flex-wrap: wrap; gap: 8px; }
    .opt { display: flex; gap: 8px; align-items: center; border: 1.5px solid var(--line-2); background: var(--card); padding: 6px 9px; cursor: pointer; text-align: left; max-width: 290px; border-radius: 12px; color: inherit; }
    .opt:hover { border-color: var(--accent); }
    .opt img { width: 34px; aspect-ratio: 63/88; object-fit: contain; }
    .opt .p { font-weight: 800; color: var(--accent-ink); }
    .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); }
    .linkbtn { background: none; border: 0; color: var(--accent-ink); text-decoration: underline; cursor: pointer; font-size: 13px; padding: 0; }
    .more { margin-top: 4px; }
    tr.info td { background: var(--soft); padding: 4px 10px 14px; }
    .figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .fig { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
    .fig .k { font-size: 12px; color: var(--ink-3); }
    .fig .v { font-size: 16px; font-weight: 800; }
    .fig.used { border-color: var(--accent); background: var(--accent-tint); }
    .fig.used .k::after { content: ' · used'; color: var(--accent-ink); font-weight: 700; }
    .basis { font-size: 13px; color: var(--ink-2); margin-top: 8px; }
    .login { max-width: 380px; margin: 10vh auto; background: var(--card); border: 1px solid var(--line); padding: 26px; border-radius: 18px; }
    .login h2 { margin: 0 0 6px; font-weight: 900; }
    .login input { display: block; width: 100%; margin-top: 10px; padding: 12px 13px; border: 1.5px solid var(--line-2); border-radius: 12px; }
    .login .btn { width: 100%; margin-top: 14px; padding: 13px; }
    .newform { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; max-width: 640px; }
    .newform h2 { margin: 0; font-size: 22px; font-weight: 900; }
    .newform p { margin: 6px 0 0; color: var(--ink-2); }
    .newform label { display: block; font-weight: 700; margin-top: 16px; }
    .newform input, .newform textarea { display: block; width: 100%; margin-top: 6px; padding: 12px 13px; border: 1.5px solid var(--line-2); border-radius: 12px; outline: none; font-size: 16px; }
    .newform textarea { min-height: 230px; line-height: 1.7; resize: vertical; }
    .newform input:focus, .newform textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-tint); }
    .newform .hint { font-size: 13px; color: var(--ink-3); font-weight: 400; }
    .newform code { background: var(--accent-tint); color: var(--accent-ink); padding: 1px 6px; border-radius: 6px; font-weight: 700; }
    .err { color: var(--bad); font-size: 14px; margin-top: 10px; }
    .hidden { display: none !important; }
    .qty-sm { display: none; }
    @media (max-width: 820px) {
      .wrap { grid-template-columns: 1fr; height: auto; }
      .list { border-right: 0; }
      body.showing .list { display: none; }
      body:not(.showing) .detail { display: none; }
      .back { display: inline-block; }
      .totals { gap: 6px; }
      .totals > div { padding: 10px; }
      .totals .k { font-size: 10px; letter-spacing: 0.04em; }
      .totals .v { font-size: 17px; }
      .qty-sm { display: inline !important; }
      th.hide-sm, td.hide-sm { display: none; }
      .detail { padding: 14px 12px 60px; }
      th, td { padding: 8px 6px; font-size: 14px; }
      th { font-size: 11px; letter-spacing: 0.04em; }
      .card img, .card .ln { display: none; }
      select { padding: 4px 2px; }
      .tabs { margin-left: 0; }
    }
  </style>
</head>
<body>
  <section id="loginView" class="hidden">
    <form class="login" id="loginForm">
      <h2>Show desk</h2>
      <p style="margin:0;color:var(--ink-3);font-size:15px">Sign in with your Card Pricer account.</p>
      <input id="email" type="email" autocomplete="username" placeholder="Email" required />
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" required />
      <button class="btn primary" type="submit" id="loginBtn">Sign in</button>
      <p class="err" id="loginErr"></p>
      <p style="margin:14px 0 0;text-align:center;font-size:14px"><a id="forgotLink" href="/reset-password" style="color:var(--accent-ink)">Forgot your password?</a></p>
    </form>
  </section>

  <section id="appView" class="hidden">
    <div class="bar">
      <h1 id="shopTitle">Show desk</h1>
      <span class="sub" id="waitingCount"></span>
      <div class="tabs">
        <button id="tabWaiting" class="on" type="button">Waiting</button>
        <button id="tabDone" type="button">Done</button>
      </div>
      <a class="link" id="posterLink" target="_blank" rel="noopener">QR poster</a>
      <button class="link" id="signOut" type="button">Sign out</button>
    </div>
    <div class="wrap">
      <div class="list">
        <button class="newbtn" id="newBtn" type="button">+ Type in a list and price it</button>
        <div id="list"><div class="empty">Loading…</div></div>
      </div>
      <div class="detail" id="detail"><div class="empty">Pick a ticket, or type in a list yourself.</div></div>
    </div>
  </section>

  <script>
  (function () {
    var SUPABASE_URL = 'https://vecbaewlxodqnevduoiy.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlY2JhZXdseG9kcW5ldmR1b2l5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3OTMyMjYsImV4cCI6MjA5MjM2OTIyNn0.FM78XIaiTzjb8MRAsFuf63Gu4gbKAlTMYrxPijkE544';
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
    var slug = (location.pathname.split('/')[2] || '').toLowerCase();
    var $ = function (id) { return document.getElementById(id); };
    var state = { status: 'waiting', items: [], selected: null, item: null, seen: {}, firstLoad: true, open: {}, allOpen: false, draft: { name: '', lines: '' } };
    var CONDITIONS = ['NM', 'EX', 'GD', 'LP', 'PL', 'PO'];
    var COND_NAMES = { NM: 'Near Mint', EX: 'Excellent', GD: 'Good', LP: 'Light Played', PL: 'Played', PO: 'Poor' };
    var REASONS = {
      no_cardmarket_product: "Not in today's Cardmarket list", no_price_in_guide: "Not in today's Cardmarket list",
      first_edition: '1st Edition, price by hand', shadowless: 'Shadowless, price by hand', graded: 'Graded slab',
      prices_stale: "Today's prices didn't load", prices_unavailable: "Today's prices didn't load",
      high_value: 'High value, price by hand', price_unstable: "Cardmarket's price looked unreliable",
      prices_disagree: "Cardmarket's prices disagree today", product_unconfirmed: 'Confirm the exact version',
      customer_unsure: 'Customer not sure which one', unconfirmed: 'Check which one'
    };
    var FIELDS = {
      nm_en: 'Cheapest Near Mint English copy', trend: 'Trend price', avg7: '7-day average sale', avg30: '30-day average sale', avg: 'Average sale price'
    };
    var WHY_NOT_NM = {
      no_listing: 'no Near Mint English copy listed', nm_en_missing: "today's Near Mint English listings didn't load", nm_en_stale: "today's Near Mint English listings are out of date",
      not_in_tcggo: 'no listing data for this card', shared_product: 'listing data is shared with another card',
      name_differs: "listing data didn't match this card", not_in_feed: 'no listing data for this card'
    };

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function eur(n) { return n == null ? '' : '€' + Number(n).toLocaleString('en-IE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function ago(iso) {
      var s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
      if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago';
      if (s < 86400) return Math.floor(s / 3600) + ' h ago';
      return new Date(iso).toLocaleDateString('en-IE', { day: 'numeric', month: 'short' });
    }
    function day(iso) { return iso ? new Date(iso + 'T12:00:00Z').toLocaleDateString('en-IE', { day: 'numeric', month: 'short' }) : ''; }
    function cardBits(c) { return c ? [c.set_name || c.set_code, c.card_number ? '#' + c.card_number : ''].filter(Boolean).join(' · ') : ''; }

    // The shop's colour, calmed (same as the customer page).
    function softAccent(hex) {
      var m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return null;
      var n = parseInt(m[1], 16), r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
      var mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn, h = 0, s = 0;
      if (d) {
        s = d / (1 - Math.abs(2 * l - 1));
        h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
        h = (h * 60 + 360) % 360;
      }
      var hsl = function (S, L) { return 'hsl(' + Math.round(h) + ' ' + Math.round(S * 100) + '% ' + Math.round(L * 100) + '%)'; };
      var S = Math.min(s, 0.5), L = Math.min(Math.max(l, 0.36), 0.44);
      return { accent: hsl(S, L), ink: hsl(S, L - 0.08), tint: hsl(Math.min(S, 0.45), 0.95), line: hsl(Math.min(S, 0.35), 0.86) };
    }
    fetch('/api/shop-config/' + encodeURIComponent(slug)).then(function (r) { return r.ok ? r.json() : null; }).then(function (s) {
      var a = s && softAccent(s.accent_color); if (!a) return;
      var root = document.documentElement.style;
      root.setProperty('--accent', a.accent); root.setProperty('--accent-ink', a.ink); root.setProperty('--accent-tint', a.tint); root.setProperty('--accent-line', a.line);
    }).catch(function () {});

    async function api(path, opts) {
      opts = opts || {};
      var sess = (await sb.auth.getSession()).data.session;
      if (!sess) { showLogin(); throw new Error('signed out'); }
      var r = await fetch(path, {
        method: opts.method || 'GET',
        headers: Object.assign({ Authorization: 'Bearer ' + sess.access_token }, opts.body ? { 'Content-Type': 'application/json' } : {}),
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });
      var b = await r.json().catch(function () { return {}; });
      if (r.status === 401) { showLogin(); throw new Error('signed out'); }
      if (!r.ok) throw new Error(b.error || ('HTTP ' + r.status));
      return b;
    }

    function showLogin() { $('appView').classList.add('hidden'); $('loginView').classList.remove('hidden'); }
    function showApp() { $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden'); }

    $('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      $('loginErr').textContent = ''; $('loginBtn').disabled = true;
      var r = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
      $('loginBtn').disabled = false;
      if (r.error) { $('loginErr').textContent = r.error.message; return; }
      start();
    });
    $('forgotLink').addEventListener('click', function (e) {
      var em = $('email').value.trim();
      if (em) { e.preventDefault(); location.href = '/reset-password?email=' + encodeURIComponent(em); }
    });
    $('signOut').addEventListener('click', async function () { await sb.auth.signOut(); showLogin(); });
    $('posterLink').href = '/show/' + slug + '/poster';

    function setTab(s) {
      state.status = s; state.selected = null; state.item = null;
      $('tabWaiting').classList.toggle('on', s === 'waiting');
      $('tabDone').classList.toggle('on', s === 'done');
      document.body.classList.remove('showing');
      $('detail').innerHTML = '<div class="empty">Pick a ticket, or type in a list yourself.</div>';
      loadList();
    }
    $('tabWaiting').addEventListener('click', function () { setTab('waiting'); });
    $('tabDone').addEventListener('click', function () { setTab('done'); });

    async function loadList() {
      try {
        var b = await api('/api/show/' + slug + '/staff/list?status=' + state.status);
        $('shopTitle').textContent = b.shop.name;
        $('waitingCount').innerHTML = b.waiting != null ? '<b>' + b.waiting + '</b> waiting' : '';
        document.title = (b.waiting ? '(' + b.waiting + ') ' : '') + 'Show desk · ' + b.shop.name;
        state.items = b.items;
        renderList();
      } catch (e) {
        if (e.message !== 'signed out') $('list').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
      }
    }

    function badgesOf(it) {
      var t = it.totals, out = [];
      if (it.price_error) out.push('<span class="badge bad">Not priced</span>');
      if (t.questions) out.push('<span class="badge warn">' + t.questions + ' to check</span>');
      if (t.not_found) out.push('<span class="badge warn">' + t.not_found + ' not matched</span>');
      if (t.by_hand) out.push('<span class="badge">' + t.by_hand + ' by hand</span>');
      if (it.outcome) out.push('<span class="badge">' + esc(it.outcome === 'declined' ? 'Didn’t sell' : it.outcome === 'bought' ? 'Bought' : it.outcome) + '</span>');
      return out.join('');
    }

    function renderList() {
      var el = $('list');
      if (!state.items.length) {
        el.innerHTML = '<div class="empty">' + (state.status === 'waiting' ? 'No one waiting. New lists show up here by themselves.' : 'Nothing done yet.') + '</div>';
        return;
      }
      el.innerHTML = state.items.map(function (it) {
        var fresh = !state.firstLoad && !state.seen[it.id] ? ' fresh' : '';
        return '<button type="button" class="tk' + (state.selected === it.id ? ' sel' : '') + fresh + '" data-id="' + esc(it.id) + '">' +
          '<span class="n">' + esc(it.ticket) + '</span>' +
          '<span class="who">' + esc(it.name) + '</span>' +
          '<span class="meta">' + esc(ago(it.created_at)) + ' · ' + it.line_count + (it.line_count === 1 ? ' line' : ' lines') + '</span>' +
          '<span class="money">' + (it.totals.cards ? '<b>' + eur(it.totals.credit) + '</b> credit · ' + eur(it.totals.cash) + ' cash' : '<span style="color:var(--ink-3)">nothing priced yet</span>') +
          '<span class="badges">' + badgesOf(it) + '</span></span>' +
          '</button>';
      }).join('');
      state.items.forEach(function (it) { state.seen[it.id] = true; });
      state.firstLoad = false;
      Array.prototype.forEach.call(el.querySelectorAll('.tk'), function (b) {
        b.addEventListener('click', function () { open(b.getAttribute('data-id')); });
      });
    }

    async function open(id) {
      state.selected = id; state.open = {}; state.allOpen = false;
      renderList();
      document.body.classList.add('showing');
      $('detail').innerHTML = '<div class="empty">Loading…</div>';
      try { state.item = await api('/api/show/' + slug + '/staff/item/' + id); renderDetail(); }
      catch (e) { $('detail').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
    }

    // ── Type a list in at the desk ────────────────────────────────────────────
    function showNew() {
      state.selected = null; state.item = null;
      renderList();
      document.body.classList.add('showing');
      $('detail').innerHTML = '<button class="back" type="button" id="backBtn">← All tickets</button>' +
        '<form class="newform" id="newForm">' +
        '<h2>Type in a list</h2>' +
        '<p>Every card gets priced, with all of Cardmarket’s numbers for it. It’s saved as a ticket, so you can mark it Bought or Didn’t sell after.</p>' +
        '<label for="nfLines">Cards <span class="hint">one per line, e.g. <code>Charizard 4/102</code>, <code>3x</code> for several, <code>rev</code> for reverse holo, <code>lp</code> for condition</span></label>' +
        '<textarea id="nfLines" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Charizard 4/102&#10;3x Pikachu 58/102&#10;rev Gengar 94/162 lp"></textarea>' +
        '<label for="nfName">Name or note <span class="hint">(optional, e.g. the seller’s name or "Box 2")</span></label>' +
        '<input id="nfName" maxlength="40" autocomplete="off" />' +
        '<div class="actions"><button class="btn primary" id="nfGo" type="submit">Price it</button></div>' +
        '<p class="err" id="nfErr"></p></form>';
      $('nfLines').value = state.draft.lines; $('nfName').value = state.draft.name;
      $('nfLines').addEventListener('input', function () { state.draft.lines = $('nfLines').value; });
      $('nfName').addEventListener('input', function () { state.draft.name = $('nfName').value; });
      $('backBtn').addEventListener('click', function () { document.body.classList.remove('showing'); });
      $('newForm').addEventListener('submit', async function (ev) {
        ev.preventDefault();
        var lines = $('nfLines').value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
        if (!lines.length) { $('nfErr').textContent = 'Add at least one card.'; return; }
        var go = $('nfGo'); go.disabled = true; go.textContent = 'Pricing…'; $('nfErr').textContent = '';
        try {
          var it = await api('/api/show/' + slug + '/staff/new', { method: 'POST', body: { lines: lines, name: $('nfName').value.trim() } });
          state.draft = { name: '', lines: '' };
          if (state.status !== 'waiting') { state.status = 'waiting'; $('tabWaiting').classList.add('on'); $('tabDone').classList.remove('on'); }
          state.item = it; state.selected = it.id; state.open = {}; state.allOpen = false;
          renderDetail(); loadList();
        } catch (e) {
          if (e.message !== 'signed out') $('nfErr').textContent = e.message;
          go.disabled = false; go.textContent = 'Price it';
        }
      });
      $('nfLines').focus();
    }
    $('newBtn').addEventListener('click', showNew);

    async function patch(body, btn) {
      if (btn) btn.disabled = true;
      try {
        state.item = await api('/api/show/' + slug + '/staff/item/' + state.item.id, { method: 'PATCH', body: body });
        renderDetail();
        loadList();
      } catch (e) { alert(e.message); }
      finally { if (btn) btn.disabled = false; }
    }

    function cardCell(card, line, extra, qty) {
      var img = card && card.image ? '<img src="' + esc(card.image) + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">' : '';
      return '<div class="card">' + img + '<div>' +
        '<div class="nm">' + (qty > 1 ? '<span class="qty-sm">' + qty + '× </span>' : '') + esc(card ? card.name : line) + '</div>' +
        (card ? '<div class="st">' + esc(cardBits(card)) + '</div>' : '') +
        '<div class="ln">“' + esc(line) + '”</div>' + (extra || '') + '</div></div>';
    }

    // Every Cardmarket number for one priced line.
    function infoRow(e) {
      var d = e.detail, g = d && d.guide;
      if (!g) return '<tr class="info"><td colspan="6"><div class="basis">No extra Cardmarket numbers stored for this line. Press Reprice to fetch them.</div></td></tr>';
      var usedField = d.basis === 'nm_en' ? 'nm_en' : String(d.field || '').replace(/_holo$/, '');
      var fig = function (key, label, v) {
        return '<div class="fig' + (key === usedField ? ' used' : '') + '"><div class="k">' + esc(label) + '</div><div class="v">' + (v == null ? '<span style="color:var(--ink-3);font-weight:600">none</span>' : eur(v)) + '</div></div>';
      };
      var figs = (g.finish === 'standard' ? fig('nm_en', 'Cheapest NM English', g.nm_en) : '') +
        fig('trend', 'Trend', g.trend) + fig('avg7', '7-day average', g.avg7) + fig('avg30', '30-day average', g.avg30) +
        fig('avg', 'Average sale', g.avg) + fig('low', 'Lowest listed (any condition)', g.low);
      var basis = 'Price used: <b>' + esc(FIELDS[usedField] || usedField) + '</b>' + (g.finish === 'reverse_holo' ? ' (reverse holo)' : '') +
        (d.as_of ? ', ' + esc(day(d.as_of)) : '') + '.';
      if (d.basis !== 'nm_en' && WHY_NOT_NM[d.nm_en_fallback]) basis += ' Not the cheapest NM English copy, because ' + esc(WHY_NOT_NM[d.nm_en_fallback]) + '.';
      if (d.condition_multiplier !== 1) basis += ' ' + esc(COND_NAMES[e.condition] || e.condition) + ' is ' + Math.round(d.condition_multiplier * 100) + '% of the Near Mint price: ' + eur(e.unit_market) + ' each.';
      if (e.qty > 1) basis += ' ' + e.qty + ' copies.';
      var link = d.cardmarket_url ? ' <a href="' + esc(d.cardmarket_url) + '" target="_blank" rel="noopener" style="color:var(--accent-ink)">Open on Cardmarket</a>' : '';
      return '<tr class="info"><td colspan="6"><div class="figs">' + figs + '</div><div class="basis">' + basis + link + '</div></td></tr>';
    }

    function renderDetail() {
      var it = state.item, t = it.totals;
      var html = '<button class="back" type="button" id="backBtn">← All tickets</button>' +
        '<div class="dh"><span class="n">' + esc(it.ticket) + '</span><span class="who">' + esc(it.name) + '</span>' +
        '<span class="meta">' + esc(ago(it.created_at)) + (it.email ? ' · ' + esc(it.email) + (it.newsletter ? ' (newsletter yes)' : '') : '') + '</span></div>' +
        (it.price_error ? '<div class="alert">This list isn’t priced: ' + esc(it.price_error) + '. Press Reprice.</div>' : '') +
        '<div class="totals"><div class="credit"><div class="k">Store credit</div><div class="v">' + eur(t.credit) + '</div></div>' +
        '<div><div class="k">Cash</div><div class="v">' + eur(t.cash) + '</div></div>' +
        '<div><div class="k">Market</div><div class="v" style="color:var(--ink-2)">' + eur(t.market) + '</div></div></div>' +
        '<p class="note">' + t.cards + (t.cards === 1 ? ' card' : ' cards') + ' priced at ' + it.rates.creditPct + '% credit, ' + it.rates.cashPct + '% cash' +
        (it.prices_as_of ? ', Cardmarket prices from ' + esc(day(it.prices_as_of)) : '') + '. Set each card’s condition once you’ve seen it. Tap <b>Details</b> on a card for all its prices.' +
        (t.questions ? ' <b>' + t.questions + ' to check.</b>' : '') + (t.not_found ? ' <b>' + t.not_found + ' not matched.</b>' : '') + '</p>' +
        '<div class="actions">' +
        (it.status === 'waiting'
          ? '<button class="btn good" id="boughtBtn" type="button">Bought</button><button class="btn" id="declinedBtn" type="button">Didn’t sell</button>'
          : '<button class="btn" id="reopenBtn" type="button">Back to waiting</button>') +
        '<button class="btn" id="repriceBtn" type="button">Reprice</button>' +
        (t.cards ? '<button class="btn" id="allBtn" type="button">' + (state.allOpen ? 'Hide all details' : 'Show all details') + '</button>' : '') + '</div>';

      html += '<div class="tablewrap"><table><thead><tr><th>Card</th><th class="hide-sm">Qty</th><th>Cond.</th><th class="num hide-sm">Market</th><th class="num">Cash</th><th class="num">Credit</th></tr></thead><tbody>';
      it.entries.forEach(function (e) {
        if (e.kind === 'priced') {
          var opts = CONDITIONS.map(function (c) { return '<option' + (c === e.condition ? ' selected' : '') + '>' + c + '</option>'; }).join('');
          var isOpen = state.allOpen || state.open[e.index];
          var notes = (e.notes || []).map(function (n) { return '<div class="nt">' + esc(n) + '</div>'; }).join('') +
            (e.finish === 'reverse_holo' ? '<div class="nt">Reverse holo</div>' : '') +
            '<div class="more"><button class="linkbtn" data-info="' + e.index + '" type="button">' + (isOpen ? 'Hide details' : 'Details') + '</button>' +
            (e.picked != null ? ' · <button class="linkbtn" data-unpick="' + e.index + '" type="button">Change which one</button>' : '') + '</div>';
          html += '<tr><td>' + cardCell(e.card, e.line, notes, e.qty) + '</td><td class="hide-sm">' + e.qty + '</td>' +
            '<td><select data-cond="' + e.index + '" aria-label="Condition">' + opts + '</select></td>' +
            '<td class="num hide-sm">' + eur(e.market) + '</td><td class="num">' + eur(e.cash) + '</td><td class="num credit">' + eur(e.credit) + '</td></tr>';
          if (isOpen) html += infoRow(e);
        } else if (e.kind === 'ask') {
          var cands = e.candidates.map(function (c, i) {
            var img = c.card && c.card.image ? '<img src="' + esc(c.card.image) + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">' : '';
            return '<button class="opt" type="button" data-pick="' + e.index + ':' + i + '">' + img + '<span><span style="font-weight:700">' + esc(c.card ? c.card.name : '') + '</span><br>' +
              '<span style="font-size:12px;color:var(--ink-3)">' + esc(c.label || cardBits(c.card)) + '</span><br>' +
              (c.market != null ? '<span class="p">' + eur(c.market) + '</span>' : '<span class="tag">' + esc(REASONS[c.unpriced_reason] || 'By hand') + '</span>') + '</span></button>';
          }).join('') + '<button class="opt" type="button" data-pick="' + e.index + ':-1">Not sure</button>';
          html += '<tr class="ask"><td colspan="6"><div style="font-weight:800">' + (e.qty > 1 ? e.qty + '× ' : '') + esc(e.line) + '</div>' +
            '<div class="q">' + esc(e.question || 'Which card is it?') + '</div><div class="opts">' + cands + '</div></td></tr>';
        } else if (e.kind === 'by_hand') {
          html += '<tr class="bh"><td colspan="3">' + cardCell(e.card, e.line, e.picked != null ? '<div class="more"><button class="linkbtn" data-unpick="' + e.index + '" type="button">Change which one</button></div>' : '') + '</td>' +
            '<td colspan="3" class="num"><span class="tag">' + esc(REASONS[e.reason] || 'Price by hand') + '</span>' + (e.qty > 1 ? '<div class="ln">' + e.qty + '×</div>' : '') + '</td></tr>';
        } else {
          html += '<tr class="nf"><td colspan="6"><div style="font-weight:700">' + esc(e.line) + '</div><div class="q" style="margin:0;color:var(--bad)">' + esc(e.message || 'Not matched.') + '</div></td></tr>';
        }
      });
      html += '</tbody></table></div>';
      $('detail').innerHTML = html;

      $('backBtn').addEventListener('click', function () { document.body.classList.remove('showing'); });
      var b1 = $('boughtBtn'); if (b1) b1.addEventListener('click', function () { patch({ status: 'done', outcome: 'bought' }, b1); });
      var b2 = $('declinedBtn'); if (b2) b2.addEventListener('click', function () { patch({ status: 'done', outcome: 'declined' }, b2); });
      var b3 = $('reopenBtn'); if (b3) b3.addEventListener('click', function () { patch({ status: 'waiting' }, b3); });
      var ab = $('allBtn'); if (ab) ab.addEventListener('click', function () { state.allOpen = !state.allOpen; state.open = {}; renderDetail(); });
      var rp = $('repriceBtn');
      rp.addEventListener('click', async function () {
        rp.disabled = true;
        try { state.item = await api('/api/show/' + slug + '/staff/item/' + it.id + '/reprice', { method: 'POST' }); renderDetail(); loadList(); }
        catch (e) { alert(e.message); } finally { rp.disabled = false; }
      });
      Array.prototype.forEach.call($('detail').querySelectorAll('[data-info]'), function (b) {
        b.addEventListener('click', function () {
          var i = b.getAttribute('data-info');
          if (state.allOpen) { state.allOpen = false; it.entries.forEach(function (x) { if (x.kind === 'priced') state.open[x.index] = true; }); }
          state.open[i] = !state.open[i]; renderDetail();
        });
      });
      Array.prototype.forEach.call($('detail').querySelectorAll('select[data-cond]'), function (s) {
        s.addEventListener('change', function () { var c = {}; c[s.getAttribute('data-cond')] = s.value; patch({ conditions: c }); });
      });
      Array.prototype.forEach.call($('detail').querySelectorAll('[data-pick]'), function (b) {
        b.addEventListener('click', function () { var p = b.getAttribute('data-pick').split(':'); var o = {}; o[p[0]] = Number(p[1]); patch({ picks: o }, b); });
      });
      Array.prototype.forEach.call($('detail').querySelectorAll('[data-unpick]'), function (b) {
        b.addEventListener('click', function () { var o = {}; o[b.getAttribute('data-unpick')] = null; patch({ picks: o }, b); });
      });
    }

    var timer = null;
    function start() {
      showApp();
      loadList();
      if (timer) clearInterval(timer);
      timer = setInterval(function () { if (!document.hidden) loadList(); }, 5000);
    }

    sb.auth.getSession().then(function (r) { if (r.data.session) start(); else showLogin(); });
  })();
  </script>
</body>
</html>
