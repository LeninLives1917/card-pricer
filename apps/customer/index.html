<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#1c1917" />
  <title>Your Card Quotes</title>
  <meta name="description" content="View and accept your card-buying offers." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 56'%3E%3Crect width='56' height='56' rx='12' fill='%231c1917'/%3E%3Crect x='14' y='10' width='28' height='36' rx='4' fill='none' stroke='%23d97706' stroke-width='2'/%3E%3C/svg%3E" />

  <!-- Editorial-terminal type system (DESIGN_BRIEF.md): Fraunces (display) + IBM Plex Sans (UI) + IBM Plex Mono (figures). Same as the vendor + quote apps. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />

  <!-- Tokens first, components second — load order matters. -->
  <link rel="preload" as="style" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/components.css" />

  <!--
    Supabase JS SDK from CDN. Same approach as the vendor + quote apps —
    the customer app is a vanilla ES-modules SPA; no bundler. The CDN
    bundle attaches `window.supabase` (factory) which main.js uses to
    construct the singleton `window.sb`.
  -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>

  <!--
    Sentry browser SDK CDN bundle (per S14 hand-off, infra/observability/sentry-browser.js).
    Pinned to 10.51.0 with SRI hash; bumping the version requires a new hash
    (curl -sSL https://browser.sentry-cdn.com/<v>/bundle.tracing.min.js | openssl dgst -sha384 -binary | openssl base64 -A).
    Customer surface initSentryBrowser({ surface: 'customer' }) is wired in main.js.
  -->
  <script src="https://browser.sentry-cdn.com/10.51.0/bundle.tracing.min.js"
          integrity="sha384-PLfi4Yv8UxpzFBe4XEbS8M1qAx+z/qs3jf7AY1XQorhPeW9SM5VarsX3+Is0NPNf"
          crossorigin="anonymous" defer></script>
  <script>
    // Sentry browser config — populated by Render env vars at request time
    // is the cleanest pattern, but for V2 we hardcode here. Empty string
    // disables Sentry (initSentryBrowser no-ops). Set the DSN to enable.
    window.__SENTRY_DSN_BROWSER__ = '';
    window.__SENTRY_ENVIRONMENT__ = 'production';
    window.__GIT_SHA__ = '';
  </script>
</head>
<body>
  <div class="wrap">
    <header class="brand">
      <div class="brand-logo" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="40" height="40">
          <rect width="56" height="56" rx="12" fill="#1c1917"/>
          <rect x="14" y="10" width="28" height="36" rx="4" fill="none" stroke="#d97706" stroke-width="2"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">Your Quotes</div>
        <div class="brand-tag">Card Buying Desk</div>
      </div>
      <nav class="nav" id="nav" aria-label="Customer navigation">
        <!-- main.js renders sign-in/out + account links here based on session state -->
      </nav>
    </header>

    <main id="view" aria-live="polite">
      <!-- Active view rendered by main.js. Empty until DOMContentLoaded. -->
      <div class="view-loading">Loading…</div>
    </main>

    <footer class="foot" id="foot">
      <p>Questions? <a id="footContact" href="mailto:dave@boardandbrewed.ie">Contact us</a>.</p>
    </footer>
  </div>

  <script type="module" src="modules/main.js" defer></script>
</body>
</html>
